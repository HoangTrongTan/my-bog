<div class="bg-slate-900/60 p-4 sm:p-6 md:p-8 rounded-2xl sm:rounded-3xl border border-white/10 shadow-2xl space-y-4 sm:space-y-6">

  <!-- Header row -->
  <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 border-b border-white/10 pb-4">
    <div class="min-w-0 w-full">
      <h2 class="text-lg sm:text-xl font-bold text-white flex items-center gap-2">
        <mat-icon class="text-amber-400 !w-5 !h-5 !text-xl shrink-0">edit_note</mat-icon>
        <span class="truncate">Chỉnh Sửa 10 Món Ăn Trong Vòng Quay</span>
      </h2>
      <p class="text-xs text-slate-400 mt-0.5 truncate">Nhập trực tiếp 10 món ăn yêu thích của bạn hoặc tùy chỉnh tên món, calories, icon</p>
    </div>

    <div class="flex items-center gap-2 w-full sm:w-auto">
      <button
        (click)="randomizeDishes.emit()"
        class="flex-1 sm:flex-initial px-3.5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-amber-300 font-semibold text-xs flex items-center justify-center gap-1.5 border border-amber-500/20 transition-all min-h-[42px]"
      >
        <mat-icon class="!w-4 !h-4 !text-base">casino</mat-icon>
        <span>🎲 AI Random Icon/Màu</span>
      </button>

      <button
        (click)="save.emit()"
        class="flex-1 sm:flex-initial px-4 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold text-xs flex items-center justify-center gap-1.5 shadow-lg transition-all min-h-[42px]"
      >
        <mat-icon class="!w-4 !h-4 !text-base">check_circle</mat-icon>
        <span>Lưu &amp; Mở Vòng Quay</span>
      </button>
    </div>
  </div>

  <!-- 10 Dishes Input Grid -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-3.5 sm:gap-4">
    @for (dish of dishes(); track dish.id; let idx = $index) {
      <div class="p-3.5 sm:p-4 rounded-xl sm:rounded-2xl bg-slate-950/70 border border-white/10 space-y-2.5">

        <div class="flex items-center justify-between">
          <span class="text-xs font-bold px-2.5 py-0.5 rounded-md bg-slate-800 text-amber-400 border border-amber-400/20">
            Món số {{ idx + 1 }}
          </span>
          <div class="flex items-center gap-2">
            <label class="text-[11px] text-slate-400">Màu sắc:</label>
            <input
              type="color"
              [ngModel]="dish.color"
              (ngModelChange)="onUpdate(idx, 'color', $event)"
              class="w-7 h-7 rounded-lg bg-transparent cursor-pointer border-0"
            />
          </div>
        </div>

        <div class="grid grid-cols-12 gap-2">
          <div class="col-span-3">
            <label class="text-[10px] text-slate-400 block mb-1">Emoji Icon</label>
            <input
              type="text"
              [ngModel]="dish.emoji"
              (ngModelChange)="onUpdate(idx, 'emoji', $event)"
              class="w-full bg-slate-900 border border-white/10 rounded-xl px-2.5 py-2 text-xs sm:text-sm text-center text-white font-emoji focus:border-amber-500 focus:outline-none min-h-[40px]"
            />
          </div>
          <div class="col-span-9">
            <label class="text-[10px] text-slate-400 block mb-1">Tên Món Ăn</label>
            <input
              type="text"
              [ngModel]="dish.name"
              (ngModelChange)="onUpdate(idx, 'name', $event)"
              placeholder="Nhập tên món..."
              class="w-full bg-slate-900 border border-white/10 rounded-xl px-3 py-2 text-xs sm:text-sm text-white focus:border-amber-500 focus:outline-none min-h-[40px]"
            />
          </div>
        </div>

        <div class="grid grid-cols-12 gap-2">
          <div class="col-span-7">
            <label class="text-[10px] text-slate-400 block mb-1">Lý Do / Mô Tả</label>
            <input
              type="text"
              [ngModel]="dish.reason"
              (ngModelChange)="onUpdate(idx, 'reason', $event)"
              placeholder="Lý do chọn..."
              class="w-full bg-slate-900 border border-white/10 rounded-xl px-3 py-2 text-xs text-slate-300 focus:border-amber-500 focus:outline-none min-h-[40px]"
            />
          </div>
          <div class="col-span-5">
            <label class="text-[10px] text-slate-400 block mb-1">Calo (kcal)</label>
            <input
              type="number"
              inputmode="numeric"
              [ngModel]="dish.calories"
              (ngModelChange)="onUpdate(idx, 'calories', $event)"
              class="w-full bg-slate-900 border border-white/10 rounded-xl px-3 py-2 text-xs text-white focus:border-amber-500 focus:outline-none min-h-[40px]"
            />
          </div>
        </div>

      </div>
    }
  </div>

</div>
